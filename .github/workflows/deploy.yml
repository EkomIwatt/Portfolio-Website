name: Deploy to GitHub Pages

# Post-cutover: `main` is the live branch. Pushes to main build and deploy to
# GitHub Pages (Pages "Source" = GitHub Actions). The deploy job is still guarded
# by the `main` ref check below as a belt-and-braces safeguard.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress production deploy.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build with Astro
        uses: withastro/action@v3
        # withastro/action auto-detects npm, builds, and uploads the Pages
        # artifact. `site`/`base` come from astro.config.mjs.

  deploy:
    needs: build
    # Late cutover: only the default branch publishes to the live URL.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
