<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Source for public/og-card.png (rasterized via sharp). Dark/crimson brand:
       near-black base, top-right crimson glow, faint dotted-grid, left crimson
       spine, "ekom." wordmark. No fabricated claims. Edit here, then re-rasterize. -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D7263D" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#D7263D" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#D7263D" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#F5F5F5" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <!-- atmosphere -->
  <rect width="1200" height="630" fill="#0A0A0A"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <ellipse cx="1060" cy="120" rx="520" ry="440" fill="url(#glow)"/>
  <!-- left editorial spine -->
  <rect x="80" y="118" width="4" height="360" fill="#D7263D"/>

  <!-- eyebrow -->
  <text x="120" y="152" font-family="'Geist Mono', ui-monospace, monospace" font-size="23"
        letter-spacing="5" fill="#8A8A8A">PORTFOLIO · 2026</text>

  <!-- wordmark -->
  <text x="116" y="332" font-family="Geist, system-ui, Arial, Helvetica, sans-serif"
        font-size="150" font-weight="800" letter-spacing="-3" fill="#F5F5F5">ekom<tspan fill="#D7263D">.</tspan></text>

  <!-- name + role -->
  <text x="120" y="416" font-family="Geist, system-ui, Arial, Helvetica, sans-serif"
        font-size="44" font-weight="600" fill="#F5F5F5">Ekomobong Iwatt</text>
  <text x="120" y="463" font-family="Geist, system-ui, Arial, Helvetica, sans-serif"
        font-size="28" fill="#8A8A8A">Software engineer · software + embedded</text>

  <!-- footer -->
  <line x1="80" y1="540" x2="1120" y2="540" stroke="#262626" stroke-width="1.5"/>
  <text x="80" y="586" font-family="'Geist Mono', ui-monospace, monospace" font-size="22"
        letter-spacing="2" fill="#F0324C">COMPUTER ENGINEERING @ UNIVERSITY OF LAGOS</text>
  <text x="1120" y="586" text-anchor="end" font-family="'Geist Mono', ui-monospace, monospace"
        font-size="22" letter-spacing="1" fill="#8A8A8A">ekomiwatt.github.io</text>
</svg>
